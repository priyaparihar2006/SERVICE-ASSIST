services:
  - type: web
    name: service-assist-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: 1
      - key: CHAT_BLOCK_CONTACT_INFO
        value: true
      - key: CHAT_ACTIVE_KEY_VERSION
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: service-assist-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CHAT_ENCRYPTION_KEYS
        sync: false

databases:
  - name: service-assist-db
    plan: free
    databaseName: service_assist
    user: service_assist
